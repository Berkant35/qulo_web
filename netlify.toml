[build]
  command = "npm run build"
  publish = "out/"

# Apex → the visitor's own language.
#
# `src/app/(standalone)/page.tsx` used to call next/navigation's redirect(),
# which cannot produce a redirect under `output: "export"` — it rendered a Next
# error page to out/index.html, and that file then shadowed the redirect rule
# below. So https://quloapp.com/ answered 200 with an error page for every
# visitor, from the site's first deploy until 2026-09-05. The page is gone;
# these rules do the work.
#
# First match wins, so the explicit languages come before the fallback.

[[redirects]]
  from = "/"
  to = "/tr/"
  status = 302
  conditions = {Language = ["tr"]}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  conditions = {Language = ["es"]}

[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  conditions = {Language = ["ar"]}

[[redirects]]
