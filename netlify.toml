  to = "/sv/"
  status = 302
  conditions = {Language = ["sv"]}

[[redirects]]
  from = "/"
  to = "/hi/"
  status = 302
  conditions = {Language = ["hi"]}

# Anything we do not publish a language for. English rather than Turkish:
# a visitor whose browser asked for none of the sixteen is, by definition, not
# asking for Turkish either, and English is the one most likely to be readable.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

# Invite links are shared without a locale prefix (`/invite/<code>`); serve the
