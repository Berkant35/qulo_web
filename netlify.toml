[build]
  command = "npm run build"
  publish = "out/"

[[redirects]]
  from = "/"
  to = "/tr/"
  status = 302

[[redirects]]
  from = "/invite/*"
  to = "/tr/invite/index.html"
  status = 200

[[redirects]]
  from = "/:locale/invite/*"
  to = "/:locale/invite/index.html"
  status = 200

# Supported locales (tr, en) — direct rewrite
[[redirects]]
  from = "/tr/help"
  to = "/tr/help/index.html"
  status = 200

[[redirects]]
  from = "/en/help"
  to = "/en/help/index.html"
  status = 200

[[redirects]]
  from = "/tr/terms"
  to = "/tr/terms/index.html"
  status = 200

[[redirects]]
  from = "/en/terms"
  to = "/en/terms/index.html"
  status = 200

[[redirects]]
  from = "/tr/privacy-policy"
  to = "/tr/privacy-policy/index.html"
  status = 200

[[redirects]]
  from = "/en/privacy-policy"
  to = "/en/privacy-policy/index.html"
  status = 200

# Unsupported locales → fallback to English
[[redirects]]
  from = "/:locale/help"
  to = "/en/help/index.html"
  status = 200

[[redirects]]
  from = "/:locale/terms"
  to = "/en/terms/index.html"
  status = 200

[[redirects]]
  from = "/:locale/privacy-policy"
  to = "/en/privacy-policy/index.html"
  status = 200

# Supported locales (tr, en) — direct rewrite
[[redirects]]
  from = "/tr/reset-password"
  to = "/tr/reset-password/index.html"
  status = 200

[[redirects]]
  from = "/en/reset-password"
  to = "/en/reset-password/index.html"
  status = 200

# Unsupported locales → fallback to English
[[redirects]]
  from = "/:locale/reset-password"
  to = "/:locale/reset-password/index.html"
  status = 200

# Supported locales (tr, en) — direct rewrite for email-verified
[[redirects]]
  from = "/tr/email-verified"
  to = "/tr/email-verified/index.html"
  status = 200

[[redirects]]
  from = "/en/email-verified"
  to = "/en/email-verified/index.html"
  status = 200

# Unsupported locales → fallback to English for email-verified
[[redirects]]
  from = "/:locale/email-verified"
  to = "/:locale/email-verified/index.html"
  status = 200

# Bare paths without locale → default (Turkish)
[[redirects]]
  from = "/reset-password"
  to = "/tr/reset-password/index.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/tr/help/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/tr/terms/index.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/tr/privacy-policy/index.html"
  status = 200

[[redirects]]
  from = "/email-verified"
  to = "/tr/email-verified/index.html"
  status = 200

# Security headers.
#
# The CSP lives here rather than in a <meta http-equiv> tag in layout.tsx:
# frame-ancestors, report-uri and sandbox are ignored when a policy is
# delivered by meta, so clickjacking protection only works as a real header.
# This is the single source of truth — do not add a second copy in the app.
#
# Why each value:
#   script-src 'unsafe-inline'  Next.js static export inlines its hydration
#                               payload and cannot use nonces (no server).
#                               'unsafe-eval' is deliberately NOT set — the
#                               production bundles contain no eval/new Function.
#   style-src  'unsafe-inline'  Next injects critical CSS inline.
#   img/font   'self'           every image, stylesheet and font is self-hosted.
#   connect-src                 the reset-password form posts to the API.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://qulo-server-production.up.railway.app; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
