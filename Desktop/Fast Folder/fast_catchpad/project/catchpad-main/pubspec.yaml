  xrandom: ^0.7.0+1

dependency_overrides:
  logging: 1.1.1
dev_dependencies:
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.10.0

  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.2.12
  flutter_test:
    sdk: flutter
  font_awesome_flutter: ^10.1.0
  freezed: "2.2.1"
  graphic: ^2.2.0
  json_serializable: "6.5.4"
  presentation_displays: ^1.0.0
  very_good_analysis: ^5.1.0

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#191819"
  adaptive_icon_foreground: "assets/app_icon/app_icon_big.png"

flutter_native_splash:
  background_image: assets/app_icon/iga_splash.png
  fullscreen: true
  fill: true
  android_12:
    # App icon background color.
    icon_background_color: "#1b1819"

    # Splash screen background color.
    color: "#1b1819"
    # App icon foreground image.
    image: assets/app_icon/app_icon_big.png
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/v2/icons/
    - assets/v2/
    - assets/v2/onboarding/
    - assets/app_icon/
    - assets/lang/
    - assets/animation/lottie/
    - assets/icons/
    - assets/iga/
    - assets/images/
    - assets/images/svg/
    - assets/images/games/
    - assets/images/vehicles/
    - assets/images/emotions/
    - assets/images/shapes/
    - assets/images/fruits/
    - assets/images/decorations/
    - assets/icons/iconsV2/
    - assets/audio/sandbox/
    - assets/audio/general/
    - assets/audio/language_game/
    - assets/audio/animals_game/
    - assets/audio/letters_game/
    - assets/audio/effect_game/
    - assets/audio/music_game/
    - assets/audio/vehicles_game/
    - assets/audio/colors_game/
    - assets/audio/catch_the_pad_game/
    - .env
  fonts:
    - family: CatchPadIcons
      fonts:
        - asset: assets/fonts/CatchPadIcons.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/poppins/ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/ExtraLightItalic.ttf
          weight: 200
        - asset: assets/fonts/poppins/Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/LightItalic.ttf
          weight: 300
        - asset: assets/fonts/poppins/Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Italic.ttf
          weight: 400
        - asset: assets/fonts/poppins/Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/poppins/SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/poppins/Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/BoldItalic.ttf
          weight: 700
        - asset: assets/fonts/poppins/ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/poppins/ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/poppins/Black.ttf
          weight: 900
        - asset: assets/fonts/poppins/BlackItalic.ttf
          weight: 900
          style: italic
flutter_intl:
  enabled: true
