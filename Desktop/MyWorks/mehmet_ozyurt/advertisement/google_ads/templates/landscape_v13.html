<!DOCTYPE html>

<meta charset="UTF-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 628px; }
  .headline { font-size: 56px; font-weight: 900; line-height: 1.08; color: #fff; }
  .headline .accent { color: var(--red); text-shadow: 0 0 40px rgba(232,99,122,0.6); }
  .sub { font-size: 16px; font-weight: 600; color: var(--lavender); letter-spacing: 3px; text-transform: uppercase; }
  .hero-cards { filter: drop-shadow(0 16px 40px rgba(0,0,0,0.45)); }
  .card-front { filter: drop-shadow(0 10px 24px rgba(0,0,0,0.35)); }

  .topic-pill {
    position: absolute;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 6;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .topic-pill.red { background: rgba(232,99,122,0.25); border-color: rgba(232,99,122,0.4); }
  .topic-pill.blue { background: rgba(45,53,97,0.4); border-color: rgba(129,136,201,0.4); }
  .topic-pill.cream { background: rgba(252,193,162,0.2); border-color: rgba(252,193,162,0.35); color: var(--cream); }

  .phone-mock {
    position: absolute;
    background: #111;
    border-radius: 22px;
    border: 3px solid #444;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px #555;
  }
  .phone-mock img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .word-card {
    position: absolute;
    background: #F5F0EB;
    border-radius: 14px;
    padding: 14px 12px;
    width: 150px;
    text-align: center;
    box-shadow: 0 6px 22px rgba(0,0,0,0.25);
    z-index: 6;
  }
  .word-card .wc-word { font-size: 18px; font-weight: 800; color: #2D3561; margin-bottom: 4px; letter-spacing: 1px; }
  .word-card .wc-forbidden { font-size: 10px; color: #999; font-weight: 600; line-height: 1.5; }
  .word-card .wc-line { width: 40px; height: 2px; background: var(--red); margin: 4px auto 6px; border-radius: 2px; }

  .logo-only-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; z-index: 5; position: relative; }
</style>

<script>
  const hash = window.location.hash;
  const m = hash.match(/ad=(\d+)/);

    const id = parseInt(m[1]);

      el.classList.toggle('active', parseInt(el.dataset.adId) === id);
    });
