<style>
  body { width: 1080px; height: 1080px; }
  .headline { font-size: 72px; font-weight: 900; line-height: 1.05; color: #fff; }
  .headline .accent { color: var(--red); text-shadow: 0 0 40px rgba(232,99,122,0.6); }
  .sub { font-size: 20px; font-weight: 600; color: var(--lavender); letter-spacing: 3px; text-transform: uppercase; }
  .hero-cards { filter: drop-shadow(0 20px 50px rgba(0,0,0,0.45)); }

  .phone {
    position: absolute;
    background: #000;
    border-radius: 36px;
    border: 4px solid #444;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 2px #555;
  }
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 24px;
    background: #000;
    border-radius: 0 0 14px 14px;
    z-index: 10;
  }
  .phone img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .logo-badge { display: flex; align-items: center; gap: 14px; }
  .logo-badge img { height: 52px; }
  .logo-only-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; z-index: 5; position: relative; }

<script>
  const hash = window.location.hash;
  const m = hash.match(/ad=(\d+)/);
  if (m) {
    const id = parseInt(m[1]);
    document.querySelectorAll('.ad').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.adId) === id);
    });
  }
